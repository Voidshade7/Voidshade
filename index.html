<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voidshade | الصفحة الرسمية</title>
    <!-- جلب الخطوط من جوجل -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;600;800;900&family=Changa:wght@400;600;800&family=Orbitron:wght@500;800&family=Outfit:wght@400;600;800&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* الألوان والإعدادات التي قمت باختيارها مسبقاً */
            --btn-bg: #212121;
            --btn-bg-2: #000000;
            --btn-text: #ffffff;
            --text-color: #ffffff;
            --card-rgb: 0, 0, 0;
            --card-opacity: 0.5;
            --card-blur: 0px;
            --bg-blur: 0px;
            --bg-dim: 0.4;
            --avatar-border-color: #000000;
            --avatar-size: 135px;
            --font-main: 'Aref Ruqaa', serif;
            --card-glow: rgba(33, 33, 33, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #050811;
            color: var(--text-color);
            overflow-x: hidden;
            position: relative;
            padding: 25px 15px;
            perspective: 1200px;
        }

        /* شاشة الدخول */
        #enter-overlay {
            position: fixed;
            inset: 0;
            background: rgba(5, 8, 17, 0.95);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.7s ease, visibility 0.7s ease;
        }
        #enter-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .enter-text {
            font-size: 1.8rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 2px;
            text-shadow: 0 0 20px var(--btn-bg), 0 0 40px var(--btn-bg);
            animation: pulseGlow 2s infinite;
            padding: 15px 35px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 50px;
            background: rgba(255,255,255,0.03);
            text-align: center;
        }

        /* الخلفية */
        #bg-media, #bg-video {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: -3;
            filter: blur(var(--bg-blur)) contrast(1.06) saturate(1.12);
            transform: scale(1.03);
        }
        .bg-overlay {
            position: fixed; inset: 0;
            background: radial-gradient(circle at center, rgba(0,0,0, calc(var(--bg-dim) - 0.15)) 0%, rgba(0,0,0, calc(var(--bg-dim) + 0.25)) 100%);
            z-index: -2;
        }

        /* التأثيرات المتحركة */
        #effects-container { position: fixed; inset: 0; pointer-events: none; z-index: -1; overflow: hidden; }

        /* البطاقة الشخصية */
        .profile-card {
            background: rgba(var(--card-rgb), var(--card-opacity));
            backdrop-filter: blur(var(--card-blur));
            -webkit-backdrop-filter: blur(var(--card-blur));
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 28px;
            padding: 42px 32px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.7), 0 0 35px var(--card-glow);
            z-index: 2;
            transition: transform 0.15s ease-out, box-shadow 0.3s ease;
            transform-style: preserve-3d;
            position: relative;
        }

        /* إطار البروفايل (حلقة نيون) */
        .avatar-container {
            width: var(--avatar-size);
            height: var(--avatar-size);
            margin: 0 auto 22px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: translateZ(30px);
        }
        .avatar-media {
            width: 100%; height: 100%; border-radius: 50%;
            object-fit: cover; background-color: #000; z-index: 2;
        }
        .frame-neon .avatar-media {
            border: 3px solid var(--avatar-border-color);
            box-shadow: 0 0 15px var(--avatar-border-color), 0 0 35px var(--avatar-border-color), inset 0 0 15px var(--avatar-border-color);
        }

        .name-wrapper { display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 10px; transform: translateZ(25px); }
        .profile-name { font-size: 2.2rem; font-weight: 700; letter-spacing: 0.5px; text-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        
        .profile-bio {
            font-size: 1.3rem; line-height: 1.7; opacity: 0.95; margin-bottom: 28px;
            white-space: pre-line; text-shadow: 0 2px 8px rgba(0,0,0,0.4); transform: translateZ(20px);
        }

        /* الأزرار (تأثير الشيمر) */
        .links-container { display: flex; flex-direction: column; gap: 15px; transform: translateZ(30px); }
        .link-btn {
            display: flex; justify-content: center; align-items: center; gap: 10px;
            background: linear-gradient(135deg, var(--btn-bg), var(--btn-bg-2));
            color: var(--btn-text); text-decoration: none; padding: 16px 22px;
            border-radius: 16px; font-weight: 700; font-size: 1.2rem;
            transition: all 0.35s ease; border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.5); position: relative; overflow: hidden; z-index: 1;
        }
        .btn-anim-shimmer::after {
            content: ''; position: absolute; top: -50%; left: -60%; width: 40%; height: 200%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
            transform: rotate(30deg); animation: shimmerSweep 3.5s infinite;
        }
        .btn-anim-shimmer:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(0,0,0,0.6); }
        @keyframes shimmerSweep { 0% { left: -60%; } 35%, 100% { left: 130%; } }
        @keyframes pulseGlow { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); box-shadow: 0 0 25px var(--btn-bg); } }

        /* مشغل الصوت */
        .audio-widget {
            position: fixed; bottom: 25px; right: 25px; background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 18px; border-radius: 50px; display: flex; align-items: center;
            gap: 12px; color: #fff; cursor: pointer; z-index: 100;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); transition: 0.3s;
        }
        .audio-widget:hover { transform: scale(1.05); }
        .equalizer { display: flex; align-items: flex-end; gap: 3px; height: 16px; }
        .eq-bar { width: 3px; background: #fff; border-radius: 2px; height: 4px; transition: 0.2s; }
        .audio-widget.playing .eq-bar { animation: eqBounce 0.8s infinite ease-in-out alternate; }
        .audio-widget.playing .eq-bar:nth-child(2) { animation-delay: 0.2s; }
        .audio-widget.playing .eq-bar:nth-child(3) { animation-delay: 0.4s; }
        .audio-widget.playing .eq-bar:nth-child(4) { animation-delay: 0.1s; }
        @keyframes eqBounce { 0% { height: 4px; } 100% { height: 16px; background: #8b5cf6; } }

        /* جزيئات الساكورا والمؤشر */
        .dom-particle { position: absolute; pointer-events: none; will-change: transform; }
        @keyframes fallDown {
            0% { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 0; }
            15% { opacity: 0.95; }
            85% { opacity: 0.95; }
            100% { transform: translateY(105vh) translateX(40px) rotate(360deg); opacity: 0; }
        }
        .cursor-sparkle {
            position: fixed; pointer-events: none; z-index: 9998; font-size: 14px;
            animation: sparkleFade 0.8s forwards ease-out;
        }
        @keyframes sparkleFade { 0% { opacity: 1; transform: scale(1) translateY(0); } 100% { opacity: 0; transform: scale(0.2) translateY(25px); } }
    </style>
</head>
<body>

    <!-- شاشة الدخول -->
    <div id="enter-overlay" onclick="enterSite()">
        <div class="enter-text">🌑 اضغط هنا للدخول الى عالمي 🌑</div>
    </div>

    <!-- وسائط الخلفية -->
    <img id="bg-media" src="https://files.catbox.moe/spj539.jpeg" alt="background">
    <div class="bg-overlay"></div>

    <!-- حاوية تأثير الساكورا -->
    <div id="effects-container"></div>

    <!-- مشغل الموسيقى -->
    <audio id="bg-audio" src="https://files.catbox.moe/c9mg5k.mp3" loop></audio>
    <div id="audio-widget" class="audio-widget" onclick="toggleAudio()">
        <div class="equalizer">
            <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
        </div>
        <span id="audio-status-text" style="font-size: 0.9rem; font-weight: 700; font-family: 'Cairo', sans-serif;">تشغيل الصوت</span>
    </div>

    <!-- البطاقة الشخصية -->
    <div class="profile-card" id="profile-card">
        <!-- فيديو البروفايل -->
        <div class="avatar-container frame-neon">
            <video class="avatar-media" autoplay loop muted playsinline src="https://files.catbox.moe/6sagkz.mp4"></video>
        </div>

        <div class="name-wrapper">
            <h1 class="profile-name">Voidshade</h1>
        </div>

        <p class="profile-bio">السلام عليكم ورحمة الله وبركاته</p>

        <!-- الأزرار والروابط -->
        <div class="links-container">
            <a href="https://discord.gg/moonknight" target="_blank" class="link-btn btn-anim-shimmer">Discord Server</a>
            <a href="https://tiktok.com/@mrgama135790" target="_blank" class="link-btn btn-anim-shimmer">Tik Tok</a>
        </div>
    </div>

    <script>
        // تشغيل الموقع عند ضغط الزائر
        function enterSite() {
            document.getElementById('enter-overlay').classList.add('hidden');
            const audio = document.getElementById('bg-audio');
            audio.play().then(() => {
                document.getElementById('audio-widget').classList.add('playing');
                document.getElementById('audio-status-text').innerText = "إيقاف الصوت";
            }).catch(() => {});
        }

        // التحكم بالصوت
        function toggleAudio() {
            const audio = document.getElementById('bg-audio');
            const widget = document.getElementById('audio-widget');
            const text = document.getElementById('audio-status-text');
            if (audio.paused) {
                audio.play();
                widget.classList.add('playing');
                text.innerText = "إيقاف الصوت";
            } else {
                audio.pause();
                widget.classList.remove('playing');
                text.innerText = "تشغيل الصوت";
            }
        }

        // تأثير أزهار الساكورا (Sakura)
        window.onload = function() {
            const container = document.getElementById('effects-container');
            for (let i = 0; i < 32; i++) {
                const el = document.createElement('div');
                el.className = 'dom-particle';
                const size = Math.random() * 14 + 8;
                el.style.left = Math.random() * 100 + 'vw';
                const duration = (Math.random() * 6 + 5) + 's';
                const delay = (Math.random() * 5) + 's';

                el.style.width = size + 'px';
                el.style.height = (size * 0.75) + 'px';
                el.style.background = 'linear-gradient(135deg, #ffb7c5, #ff69b4)';
                el.style.borderRadius = '15px 0px 15px 0px';
                el.style.boxShadow = '0 0 10px rgba(255, 183, 197, 0.6)';
                el.style.animation = `fallDown ${duration} linear ${delay} infinite`;

                container.appendChild(el);
            }

            setup3DTilt();
            setupCursorTrail();
        };

        // حركة 3D للبطاقة مع الماوس
        function setup3DTilt() {
            const card = document.getElementById('profile-card');
            document.addEventListener('mousemove', (e) => {
                if (window.innerWidth < 768) return;
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left - rect.width / 2;
                const y = e.clientY - rect.top - rect.height / 2;
                const rotateX = (-y / 22).toFixed(2);
                const rotateY = (x / 22).toFixed(2);
                card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            });
            document.addEventListener('mouseleave', () => {
                card.style.transform = 'rotateX(0deg) rotateY(0deg)';
            });
        }

        // أثر النجوم لمؤشر الماوس
        function setupCursorTrail() {
            let lastTime = 0;
            document.addEventListener('mousemove', (e) => {
                const now = Date.now();
                if (now - lastTime < 55) return;
                lastTime = now;

                const sp = document.createElement('div');
                sp.className = 'cursor-sparkle';
                const icons = ['✨', '⭐', '💫', '🔸'];
                sp.innerText = icons[Math.floor(Math.random() * icons.length)];
                sp.style.left = e.clientX + 'px';
                sp.style.top = e.clientY + 'px';
                sp.style.filter = `drop-shadow(0 0 6px #212121)`;
                document.body.appendChild(sp);

                setTimeout(() => sp.remove(), 800);
            });
        }
    </script>
</body>
</html>
