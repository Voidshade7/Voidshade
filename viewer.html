<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحتي الشخصية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body {
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            background-color: #050811; color: #fff; overflow-x: hidden; position: relative; padding: 25px 15px;
        }
        #bg-media, #bg-video {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -3;
        }
        .bg-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: -2; }
        .profile-card {
            background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 28px;
            padding: 42px 32px; width: 100%; max-width: 500px; text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.7); z-index: 2;
        }
        .avatar-container {
            width: 135px; height: 135px; margin: 0 auto 22px; position: relative;
            border-radius: 50%; padding: 4px; background: linear-gradient(45deg, #6366f1, #ec4899);
        }
        .avatar-container img, .avatar-container video {
            width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #0f172a;
        }
        .profile-name { font-size: 2rem; font-weight: 900; margin-bottom: 10px; }
        .profile-bio { font-size: 1.05rem; line-height: 1.7; opacity: 0.92; margin-bottom: 28px; white-space: pre-line; }
        .links-container { display: flex; flex-direction: column; gap: 15px; }
        .link-btn {
            display: block; background: #6366f1; color: #fff; text-decoration: none;
            padding: 16px 22px; border-radius: 16px; font-weight: 700; font-size: 1.08rem;
            transition: 0.3s; box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .link-btn:hover { transform: translateY(-3px); filter: brightness(1.1); }
    </style>
</head>
<body>
    <img id="bg-media" src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1920&q=85" alt="bg">
    <video id="bg-video" autoplay loop muted playsinline style="display: none;"></video>
    <div class="bg-overlay"></div>

    <div class="profile-card">
        <div class="avatar-container">
            <img id="avatar-img" src="https://media.giphy.com/media/qgQUggAC3Pfv687qPC/giphy.gif" alt="Avatar">
            <video id="avatar-video" autoplay loop muted playsinline style="display: none;"></video>
        </div>
        <h1 class="profile-name" id="display-name">Voidshade</h1>
        <p class="profile-bio" id="display-bio">مرحباً بك في صفحتي الشخصية</p>
        <div class="links-container" id="display-links">
            <a href="https://discord.gg/moonknight" class="link-btn" target="_blank">Discord Server</a>
            <a href="https://tiktok.com/@mrgama135790" class="link-btn" target="_blank">Tik Tok</a>
        </div>
    </div>
</body>
</html>
